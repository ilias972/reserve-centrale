[project]
name = "reserve-centrale"
version = "0.1.0"
description = "Application de gestion de stocks internes pour une organisation"
requires-python = ">=3.13,<3.14"
dependencies = ["Django>=5.2.18,<5.3", "psycopg[binary]>=3.3.6,<4", "argon2-cffi==25.1.0", "Pillow==13.0.0", "pywebpush==2.5.0"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"**/migrations/**" = ["E", "I"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
